# ms-catalogo: usa el mismo .env que ms-usuarios (misma base y misma JWT_SECRET)
server.port=8082
spring.application.name=ms-catalogo

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crean los scripts de la carpeta sql/; Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT: este servicio NO emite tokens, solo valida los que emite ms-usuarios
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ferreteria-ms-usuarios
app.jwt.audience=ferreteria-api

app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

springdoc.swagger-ui.path=/swagger-ui.html
