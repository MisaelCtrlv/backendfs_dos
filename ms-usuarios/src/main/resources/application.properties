# ms-usuarios: todos los valores sensibles vienen de variables de entorno (.env)
server.port=8081
spring.application.name=ms-usuarios

# Conexion a RDS PostgreSQL (TLS con sslmode=require en DB_URL)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Las tablas las crean los scripts de la carpeta sql/; Hibernate no las modifica
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.issuer=ferreteria-ms-usuarios
app.jwt.audience=ferreteria-api
app.jwt.expiracion-minutos=120

# CORS: origenes permitidos separados por coma
app.cors.origins=${CORS_ORIGINS:http://localhost:5173}

# Crea los usuarios de prueba si no existen
app.seed.enabled=true

springdoc.swagger-ui.path=/swagger-ui.html
